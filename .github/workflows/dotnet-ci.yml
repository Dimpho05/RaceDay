name: Build and Test API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Part2/RaceDay/RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build
        run: dotnet build Part2/RaceDay/RaceDay.Tests/RaceDay.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2/RaceDay/RaceDay.Tests/RaceDay.Tests.csproj --no-build --configuration Release --verbosity normal
