name: Validate Docs Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD file exists (PNG or PDF)
        run: |
          if ! ls docs/*.png docs/*.pdf 1> /dev/null 2>&1; then
            echo "ERROR: No ERD file (.png or .pdf) found in /docs."
            exit 1
          fi
          echo "ERD file found."

      - name: Check API endpoint plan exists (PDF or Markdown)
        run: |
          if ! ls docs/*endpoint* 1> /dev/null 2>&1; then
            echo "ERROR: No API endpoint plan file found in /docs (expected filename containing 'endpoint')."
            exit 1
          fi
          echo "Endpoint plan file found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No .sql file found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid for Part 1 submission."
