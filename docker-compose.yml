# Starts the whole RaceDay application with one command:
#   docker compose up --build
#
#   web        the MVC web app          http://localhost:8080
#   api        the RaceDay API          http://localhost:8081/swagger
#   sqlserver  the database (internal only)
name: raceday

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in the .env file}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./Part2/RaceDay
      dockerfile: RaceDay.Api/Dockerfile
    environment:
      TZ: Africa/Johannesburg
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=RaceDayApiDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      BlobStorage__ConnectionString: ${BLOB_CONNECTION_STRING:?Set BLOB_CONNECTION_STRING in the .env file}
      BlobStorage__ContainerName: raceday-images
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8081:8080"
    restart: unless-stopped

  web:
    build:
      context: ./Part2/RaceDay
      dockerfile: RaceDay.Web/Dockerfile
    environment:
      TZ: Africa/Johannesburg
      Api__BaseUrl: http://api:8080/
    depends_on:
      - api
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sqlserver-data: